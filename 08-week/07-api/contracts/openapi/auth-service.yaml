  /auth/jwks:
    get:
      summary: Read public signing keys
      operationId: AuthReadpublicsigningkeys
      tags:
      - Auth
      description: Only public RSA signing keys with kid; never private key material. Rotation retains verification
        keys until issued access tokens expire.
      x-roles: []
      x-requirements:
      - HU-IAM-001
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        kty:
                          type: string
                          enum:
                          - RSA
                        kid:
                          type: string
                          minLength: 1
                          maxLength: 255
                        use:
                          type: string
                          enum:
                          - sig
                        alg:
                          type: string
                          enum:
                          - RS256
                        n:
                          type: string
                          minLength: 1
                          maxLength: 2048
                        e:
                          type: string
                          minLength: 1
                          maxLength: 32
                      required:
                      - kty
                      - kid
                      - use
                      - alg
                      - n
                      - e
                required:
                - keys
        '400':
          $ref: ./_shared.yaml#/components/responses/BadRequest
        '500':
          $ref: ./_shared.yaml#/components/responses/InternalError
        '503':
          $ref: ./_shared.yaml#/components/responses/ServiceUnavailable
      security: []
