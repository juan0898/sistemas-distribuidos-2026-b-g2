groups:
  - name: billing-payment-slo
    interval: 30s
    rules:
      # Fast burn: 14.4x the 99.9% availability error budget.
      # Both 1h and 5m windows must exceed the threshold.
      # Minimum error count reduces noise at low traffic.
      - alert: BillingPaymentAvailabilityFastBurn
        expr: |
          (
            (
              sum(rate(billing_payment_requests_total{
                operation="record_payment",outcome="error"
              }[1h]))
              /
              clamp_min(
                sum(rate(billing_payment_requests_total{
                  operation="record_payment"
                }[1h])),
                0.001
              )
            ) > (14.4 * 0.001)
          )
          and
          (
            (
              sum(rate(billing_payment_requests_total{
                operation="record_payment",outcome="error"
              }[5m]))
              /
              clamp_min(
                sum(rate(billing_payment_requests_total{
                  operation="record_payment"
                }[5m])),
                0.001
              )
            ) > (14.4 * 0.001)
          )
          and
          (
            sum(increase(billing_payment_requests_total{
              operation="record_payment",outcome="error"
            }[1h])) >= 2
          )
        for: 2m
        labels:
          severity: critical
          service: billing
          journey: record_payment
          slo: availability
        annotations:
          summary: "Billing payment availability error budget is burning fast"
          description: "The payment error ratio exceeds 14.4x the 99.9% SLO budget in both 1h and 5m windows, with at least two errors in 1h."
          runbook_url: "https://github.com/juan0898/sistemas-distribuidos-2026-b-g2/blob/main/11-week/workshop/07-runbook.md"

      # Slow burn: 6x the availability error budget.
      # Sustained errors must appear in both 6h and 30m windows.
      - alert: BillingPaymentAvailabilitySlowBurn
        expr: |
          (
            (
              sum(rate(billing_payment_requests_total{
                operation="record_payment",outcome="error"
              }[6h]))
              /
              clamp_min(
                sum(rate(billing_payment_requests_total{
                  operation="record_payment"
                }[6h])),
                0.001
              )
            ) > (6 * 0.001)
          )
          and
          (
            (
              sum(rate(billing_payment_requests_total{
                operation="record_payment",outcome="error"
              }[30m]))
              /
              clamp_min(
                sum(rate(billing_payment_requests_total{
                  operation="record_payment"
                }[30m])),
                0.001
              )
            ) > (6 * 0.001)
          )
          and
          (
            sum(increase(billing_payment_requests_total{
              operation="record_payment",outcome="error"
            }[6h])) >= 2
          )
        for: 5m
        labels:
          severity: warning
          service: billing
          journey: record_payment
          slo: availability
        annotations:
          summary: "Billing payment availability error budget is burning"
          description: "The payment error ratio exceeds 6x the 99.9% SLO budget in both 6h and 30m windows, with at least two errors in 6h."
          runbook_url: "https://github.com/juan0898/sistemas-distribuidos-2026-b-g2/blob/main/11-week/workshop/07-runbook.md"

      # Diagnostic saturation alert, not an SLO burn-rate alert.
      - alert: BillingPaymentDatabaseSaturation
        expr: |
          (
            billing_db_connections_in_use{pool="billing"}
            /
            clamp_min(
              billing_db_connections_max{pool="billing"},
              1
            )
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          service: billing
          journey: record_payment
          signal: saturation
        annotations:
          summary: "Billing database connection utilization is high"
          description: "The proposed Billing connection pool exceeds 85% utilization for 10 minutes. Check whether payment latency or failures are affected."
          runbook_url: "https://github.com/juan0898/sistemas-distribuidos-2026-b-g2/blob/main/11-week/workshop/07-runbook.md"
